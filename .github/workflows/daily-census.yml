name: Daily stake census

on:
  schedule:
    # 08:00 Asia/Shanghai. GitHub may start the job later than the clock time.
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: daily-census
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run bootstrap

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json data/address-index.json
          if git diff --cached --quiet; then
            echo "快照没有变化"
            exit 0
          fi
          git commit -m "Update the daily stake census snapshot."
          git push
